name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['24', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check committed standalone bundles
        run: npm run check:bundles
      - name: Test helpers and contracts
        run: npm test
      - name: Exercise installed Skills and multi-repository releases
        run: npm run check:examples
      - name: Check offline evaluation fixtures (no model calls)
        run: npm run check:evals
      - name: Exercise packed CLI and library without development dependencies
        run: npm run check:package
